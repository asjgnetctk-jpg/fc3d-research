<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#163f31" />
    <meta name="description" content="福彩3D独胆、5码、6码、7码与组三概率逐期滚动研究台账。" />
    <title>福彩3D · 五项滚动研究</title>
    <link rel="stylesheet" href="./styles.css" />
    <script src="./assets/app.js" defer></script>
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">福彩3D · 私人研究台</p>
          <h1>五项滚动研究</h1>
        </div>
        <button id="refresh" class="refresh-button" type="button">刷新</button>
      </header>

      <div class="beijing-clock">
        <span>北京时间</span>
        <strong id="beijing-time">正在校时</strong>
      </div>

      <nav class="version-switch" aria-label="切换算法版本">
        <a class="is-active" href="./" aria-current="page"><strong>V7</strong><span>当前算法</span></a>
        <a href="./v5.html"><strong>V5</strong><span>历史算法</span></a>
      </nav>

      <div id="loading" class="notice">正在读取最新开奖和推荐记录…</div>
      <div id="error" class="notice error" hidden></div>

      <div id="content" hidden>
        <section class="status-strip">
          <span class="status-dot"></span>
          <span id="formula-version"></span>
          <span>·</span>
          <span id="training-date"></span>
        </section>

        <section class="section-block integrity-block">
          <p id="evaluation-notice" class="section-note"></p>
          <div class="audit-links">
            <a href="./audit/full-history-integrity.json">查看7706期数据真实性报告</a>
            <a href="./audit/full-history-training.json">查看全历史训练与回放报告</a>
          </div>
          <small id="integrity-summary"></small>
        </section>

        <nav class="play-tabs" aria-label="切换研究项目">
          <button class="is-active" data-play="dan">独胆</button>
          <button data-play="pool5">5码</button>
          <button data-play="pool6">6码</button>
          <button data-play="pool7">7码</button>
          <button data-play="group3">组三</button>
        </nav>

        <section class="hero-card play-hero">
          <div class="hero-meta">
            <span id="target-issue"></span>
            <span id="based-on"></span>
          </div>
          <div id="current-play"></div>
          <div id="source-line" class="source-line"></div>
        </section>

        <section class="section-block total-result">
          <div class="section-heading">
            <div>
              <p class="eyebrow">全部期数总结果</p>
              <h2 id="metric-title"></h2>
            </div>
            <span id="total-periods" class="backfit-chip"></span>
          </div>
          <div class="metric-card">
            <span id="metric-count-label"></span>
            <strong id="metric-score"></strong>
            <small id="metric-detail"></small>
          </div>
          <div id="recent-one-year" class="recent-metric one-year"></div>
          <div id="recent-three-year" class="recent-metric three-year"></div>
          <p id="group3-metric-note" class="section-note" hidden>
            未明确推荐组三的期数不算中奖，也不算失败；避免用“非组三概率高”抬高成绩。
          </p>
        </section>

        <section class="section-block history-section">
          <div class="section-heading">
            <div>
              <p id="history-eyebrow" class="eyebrow"></p>
              <h2>当期推荐、开奖号与真实结果</h2>
            </div>
          </div>
          <p class="section-note">每一期只使用该期开奖前的数据；开奖后才进入下一期训练与计算。</p>
          <div class="history-search">
            <input id="history-search" type="search" placeholder="搜期号、日期、开奖号或推荐号码" />
            <span id="search-count"></span>
          </div>
          <div id="history" class="history-list"></div>
          <button id="toggle-history" class="secondary-button" type="button"></button>
        </section>

        <section class="section-block formula-block">
          <button id="toggle-formula" class="formula-toggle" type="button" aria-expanded="false">
            <span><small id="formula-label"></small><strong>这项每天怎么选？</strong></span>
            <b>+</b>
          </button>
          <div id="formula" class="formula-content" hidden>
            <p id="formula-text"></p>
            <div id="formula-audits" class="audit-links"></div>
          </div>
        </section>

        <footer>
          <strong>只做研究记录，不承诺中奖</strong>
          <p>历史最短断档不代表未来必然复制。不要追损、翻倍、借钱或超预算投注。</p>
          <span id="generated-at"></span>
        </footer>
      </div>
    </main>
  </body>
</html>
