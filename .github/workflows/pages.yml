name: 更新福彩3D数据并发布

on:
  schedule:
    # 北京时间 08:17—20:17 每两小时巡检；开奖时段 21:00—01:45 每15分钟补抓。
    - cron: "17 0-12/2 * * *"
    - cron: "*/15 13-17 * * *"
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 优先读取福彩官方开奖并生成静态数据
        timeout-minutes: 8
        run: node scripts/generate-v7-static-data.mjs
      - name: 更新体彩排列3官方历史数据
        timeout-minutes: 8
        run: node scripts/fetch-pl3-history.mjs
      - name: 生成体彩排列3独立页面数据
        env:
          LOTTERY_GAME: "pl3"
        run: node scripts/generate-v7-static-data.mjs
      - name: 生成福彩3D V9实验数据
        run: node scripts/generate-v9-static-data.mjs
      - name: 生成福彩3D V9.2近一年实验数据
        env:
          V9_VARIANT: "v9-2"
          V9_CONFIG_NAME: "v9-2-low-hit-config.json"
          V9_RESULT_NAME: "v9-2-low-hit-training.json"
        run: node scripts/generate-v9-static-data.mjs
      - name: 发布前逐期核对数据、命中标记和连续遗漏
        run: node --test tests/published-data-integrity.test.mjs tests/combination-omissions.test.mjs tests/pl3-data.test.mjs tests/v9-low-hit.test.mjs tests/v9-2-low-hit.test.mjs
      - name: 保存验证后的最新开奖和页面数据
        run: |
          if ! git diff --quiet -- scripts/data/fc3d-full-history.json scripts/results/full-history-integrity.json scripts/data/pl3-full-history.json scripts/results/pl3-full-history-integrity.json pages public; then
            git config user.name "fc3d-data-bot"
            git config user.email "actions@users.noreply.github.com"
            git add scripts/data/fc3d-full-history.json scripts/results/full-history-integrity.json scripts/data/pl3-full-history.json scripts/results/pl3-full-history-integrity.json pages public
            git commit -m "Update verified 3-digit draw data and pages [skip ci]"
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: 发布到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
