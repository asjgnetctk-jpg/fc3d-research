name: 更新福彩3D数据并发布

on:
  schedule:
    # 每两小时持续补抓一次：官方开奖若延迟发布，后续任务会自动补上。
    - cron: "17 */2 * * *"
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 更新体彩排列3官方历史数据
        run: node scripts/fetch-pl3-history.mjs
      - name: 读取官方开奖并生成静态数据
        run: node scripts/generate-v7-static-data.mjs
      - name: 生成体彩排列3独立页面数据
        env:
          LOTTERY_GAME: "pl3"
        run: node scripts/generate-v7-static-data.mjs
      - name: 保存验证后的最新开奖和页面数据
        run: |
          if ! git diff --quiet -- scripts/data/fc3d-full-history.json scripts/results/full-history-integrity.json scripts/data/pl3-full-history.json scripts/results/pl3-full-history-integrity.json pages public; then
            git config user.name "fc3d-data-bot"
            git config user.email "actions@users.noreply.github.com"
            git add scripts/data/fc3d-full-history.json scripts/results/full-history-integrity.json scripts/data/pl3-full-history.json scripts/results/pl3-full-history-integrity.json pages public
            git commit -m "Update verified 3-digit draw data and pages [skip ci]"
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: 发布到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
